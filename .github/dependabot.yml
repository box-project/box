version: 2
updates:
    -   package-ecosystem: "composer"
        directory: "."
        schedule:
            interval: "weekly"
        groups:
            dependencies:
                patterns:
                    - "*"
        cooldown:
            default-days: 7

    -   package-ecosystem: "composer"
        directory: "requirement-checker"
        schedule:
            interval: "weekly"
        groups:
            dependencies:
                patterns:
                    - "*"
        cooldown:
            default-days: 7

    -   package-ecosystem: "composer"
        directory: "vendor-bin/*/"
        schedule:
            interval: "weekly"
        groups:
            dependencies:
                patterns:
                    - "*"
        cooldown:
            default-days: 7

    -   package-ecosystem: "github-actions"
        directory: ".github/workflows"
        schedule:
            interval: "weekly"
        groups:
            dependencies:
                patterns:
                    - "*"
        cooldown:
            default-days: 7

    -   package-ecosystem: "docker-compose"
        directory: "."
        schedule:
            interval: "weekly"
        cooldown:
            default-days: 7
        groups:
            dependencies:
                patterns:
                    - "*"
