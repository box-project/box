name: Docker

on:
    push:
        branches: [ main ]
    pull_request: ~
    schedule:
        # Do not make it the first of the month and/or midnight since it is a very busy time
        - cron: "* 10 5 * *"
    release:
        types: [ created ]

# See https://stackoverflow.com/a/72408109
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    TERM: xterm

permissions:
    contents: read

jobs:
    docker-build:
        runs-on: ubuntu-latest
        name: Publish the Docker image ${{ matrix.name }}
        permissions:
            contents: read
            packages: write  # Required to push the image to the GitHub Container Registry.
        # See https://github.com/phpstan/phpstan/commit/4a535193101975e50fbaeea92ca6eca8c7a349b1
        concurrency: docker-build-${{ github.ref }}-${{ matrix.docker-file }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: PHP 7.2.5
                      docker-file: .docker/php725
                      image-tag: ghcr.io/box-project/box_php725
                    - name: PHP 8.2
                      docker-file: .docker/php82
                      image-tag: ghcr.io/box-project/box_php82
                    - name: PHP 8.2 (Xdebug)
                      docker-file: .docker/php82_xdebug
                      image-tag: ghcr.io/box-project/box_php82_xdebug
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Set up QEMU
                uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            -   name: Login to GitHub Container Registry
                uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and export to Docker
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: .
                    file: ${{ matrix.docker-file }}
                    platforms: linux/amd64
                    tags: ${{ matrix.image-tag }}
                    load: true

            -   name: Test the image
                run: docker run --rm ${{ matrix.image-tag }} php --version

            -   name: Build and push
                if: ${{ github.ref_name == 'main' }}
                uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
                with:
                    context: .
                    file: ${{ matrix.docker-file }}
                    platforms: linux/amd64
                    tags: ${{ matrix.image-tag }}
                    push: true
                    # See https://github.com/phpstan/phpstan/pull/7373/files
                    # for the scope.
                    cache-from: type=gha, scope=${{ github.workflow }}
                    cache-to: type=gha, scope=${{ github.workflow }}

    # This is a "trick", a meta task which does not change, and we can use in
    # the protected branch rules as opposed to the tests one above which
    # may change regularly.
    validate-images:
        name: Docker status
        runs-on: ubuntu-latest
        needs: docker-build
        if: always()
        steps:
            - run: exit 0
